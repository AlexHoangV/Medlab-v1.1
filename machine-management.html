<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Quản Lý Máy Móc – Med Lab</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <link rel="stylesheet" href="styles/app.css"/>
  <link rel="stylesheet" href="styles/modules.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="page-header">
        <div class="page-header__left">
          <h2>Quản Lý Máy Móc &amp; Thiết Bị</h2>
          <p>CRUD thiết bị VLTL – 46 máy thực tế. Mã máy lấy từ cột F danh sách chuẩn hóa khoa (22.1.2026).</p>
        </div>
        <div class="page-header__actions">
          <button class="btn btn--ghost btn--sm" onclick="exportMachineCSV()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Xuất CSV
          </button>
          <button class="btn btn--primary" onclick="openModal('addMachineModal')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
            Thêm máy
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div class="patient-status-row" id="machineStats"></div>

      <!-- Filter -->
      <div class="filter-bar">
        <div class="topbar__search" style="min-width:280px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="machineSearch" placeholder="Tên máy, mã máy, thủ thuật..." oninput="renderMachineGroups()"/>
        </div>
        <select class="form-select" id="machineStatusFilter" onchange="renderMachineGroups()" style="width:180px">
          <option value="">Tất cả trạng thái</option>
          <option value="ACTIVE">Hoạt động</option>
          <option value="MAINTENANCE">Bảo trì</option>
          <option value="INACTIVE">Ngừng hoạt động</option>
        </select>
        <select class="form-select" id="machineGroupFilter" onchange="renderMachineGroups()" style="width:200px">
          <option value="">Tất cả nhóm</option>
          <option value="dien_cham">Điện châm</option>
          <option value="hong_ngoai">Hồng ngoại</option>
          <option value="sieu_am">Siêu âm</option>
          <option value="dien_xung">Điện xung</option>
          <option value="oxy_cao_ap">Oxy cao áp</option>
          <option value="keo_gian">Kéo giãn</option>
          <option value="laser_noi_mach">Laser nội mạch</option>
          <option value="song_ngan">Sóng ngắn</option>
          <option value="parafin">Parafin</option>
          <option value="tap_vd">Xe đạp tập</option>
        </select>
      </div>

      <!-- Machine groups -->
      <div id="machineGroupsWrap"></div>

    </main>
  </div>
</div>

<!-- Add Machine Modal -->
<div class="modal-overlay" id="addMachineModal">
  <div class="modal">
    <div class="modal__header"><div class="modal__title">Thêm máy / thiết bị mới</div><button class="modal__close" onclick="closeModal('addMachineModal')">✕</button></div>
    <div class="modal__body">
      <div class="form-row">
        <div class="form-group" style="flex:2"><label class="form-label">Tên thiết bị <span style="color:red">*</span></label><input class="form-input" id="mName" placeholder="VD: Máy điện châm SDZ-II"/></div>
        <div class="form-group"><label class="form-label">Ký hiệu</label><input class="form-input" id="mKyHieu" placeholder="VD: SDZ-II"/></div>
      </div>
      <div class="form-row" style="margin-top:12px">
        <div class="form-group"><label class="form-label">Mã máy (cột F) <span style="color:red">*</span></label><input class="form-input" id="mMaMay" placeholder="VD: CC.1.26017.xxx"/></div>
        <div class="form-group"><label class="form-label">Mã DVKT</label><input class="form-input" id="mMaDVKT" placeholder="VD: 800.050.230"/></div>
      </div>
      <div class="form-group" style="margin-top:12px"><label class="form-label">Tên dịch vụ kỹ thuật</label><input class="form-input" id="mTenDVKT" placeholder="VD: Điều trị bằng điện châm"/></div>
      <div class="form-row" style="margin-top:12px">
        <div class="form-group"><label class="form-label">Thủ thuật áp dụng</label>
          <select class="form-select" id="mProcedure">
            <option value="">-- Không dùng máy --</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Trạng thái</label>
          <select class="form-select" id="mStatus"><option value="ACTIVE">Hoạt động</option><option value="MAINTENANCE">Bảo trì</option><option value="INACTIVE">Ngừng hoạt động</option></select>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" onclick="closeModal('addMachineModal')">Hủy</button>
      <button class="btn btn--primary" onclick="addMachine()">Thêm thiết bị</button>
    </div>
  </div>
</div>

<!-- Edit Machine Modal -->
<div class="modal-overlay" id="editMachineModal">
  <div class="modal">
    <div class="modal__header"><div class="modal__title">Chỉnh sửa thiết bị</div><button class="modal__close" onclick="closeModal('editMachineModal')">✕</button></div>
    <div class="modal__body" id="editMachineBody"></div>
    <div class="modal__footer">
      <button class="btn btn--ghost" onclick="closeModal('editMachineModal')">Hủy</button>
      <button class="btn btn--primary" onclick="saveMachineEdit()">Lưu thay đổi</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/machine.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    renderSidebar('machine-management');
    renderTopbar();
    renderMachineGroups();
    renderMachineStats();
    // populate procedure select
    const sel = document.getElementById('mProcedure');
    PROCEDURE_DICT.forEach(p => { const o=document.createElement('option'); o.value=p.id; o.textContent=p.name; sel.appendChild(o); });
  });
</script>
</body>
</html>
